<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5F5F4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
--bg:#F5F5F4;
--card:#FFFFFF;
--text:#2A2A2A;
--muted:#8A8A8A;
--soft:#EFEFEF;
--accent:#DADADA;

--pill-ins-bg:rgba(120,140,160,.18);
--pill-ins-tx:#3B4A5A;
--pill-carb-bg:rgba(120,160,140,.20);
--pill-carb-tx:#355B48;
--pill-bg-bg:rgba(160,140,120,.20);
--pill-bg-tx:#5A4635;
--hypo:#B45050;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;
background:var(--bg);
color:var(--text);
}

body{display:flex;flex-direction:column}

#splash{
position:fixed;inset:0;
background:var(--bg);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:600;
z-index:9999;
animation:fadeOut 1.2s ease forwards;
animation-delay:1.2s;
}
#splash img{width:110px;margin-bottom:16px}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}

main{
flex:1;
padding:18px;
padding-bottom:92px;
}
section{display:none}
section.active{display:block}

.box{
background:var(--card);
padding:20px;
margin-bottom:20px;
border-radius:22px;
box-shadow:
0 10px 25px rgba(0,0,0,.06),
0 4px 10px rgba(0,0,0,.04);
}

h3{
font-size:17px;
margin-bottom:10px;
font-weight:600;
}

label{
display:block;
margin-top:16px;
font-size:14px;
color:var(--muted);
}

input{
width:100%;
margin-top:8px;
padding:15px 16px;
font-size:17px;
border:none;
border-radius:15px;
background:var(--soft);
}

/* ===== MINIMALISTA GOMBOK – FIX ===== */
button{
margin-top:18px;
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:999px;
background:rgba(0,0,0,.04);
color:var(--text);
font-weight:600;
}
button:active{transform:scale(.97)}
.secondary{background:rgba(0,0,0,.03)}
.danger{background:rgba(180,80,80,.18)}

.history-item{
padding:12px 0;
font-size:15px;
line-height:1.45;
}

.pill{
display:inline-block;
padding:4px 12px;
border-radius:999px;
font-weight:600;
font-size:13px;
margin-right:6px;
}

.pill.insulin{
background:var(--pill-ins-bg);
color:var(--pill-ins-tx);
}
.pill.carb{
background:var(--pill-carb-bg);
color:var(--pill-carb-tx);
}

.small{font-size:13px;color:var(--muted)}

.pill.bg{
background:var(--pill-bg-bg);
color:var(--pill-bg-tx);
}

canvas.chart{
display:block;
width:100%;
height:90px;
margin-top:12px;
}

#tabBar{
position:fixed;
bottom:0;left:0;right:0;
height:72px;
background:var(--card);
display:flex;
border-top:1px solid var(--accent);
}

.tab{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:13px;
color:var(--muted);
}

.tab.active{color:var(--text)}

.tab svg{
width:22px;
height:22px;
stroke:currentColor;
fill:none;
stroke-width:1.6;
margin-bottom:4px;
}
</style>
</head>

<body>

<div id="splash">
<img src="icon-512.png">
Betöltés…
</div>

<main style="display:none">

<section id="home" class="active">
<div class="box">
<h3>Számítás</h3>
<label>Szénhidrát (g)</label>
<input id="carbs" type="number">
<label>Aktuális vércukor (mmol/L)</label>
<input id="bg" type="number" step="0.1">
<button onclick="calculate()">Számolás</button>
<div id="result" style="margin-top:14px"></div>
<button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
<button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
</div>

<div class="box">
<h3>Aktív inzulin</h3>
<div id="iob"></div>
<canvas id="iobChart" class="chart"></canvas>

<h3 style="margin-top:20px">Várható vércukor</h3>
<canvas id="bgPredictionChart" class="chart"></canvas>
<div id="bgPredictionHint" class="small" style="margin-top:6px"></div>
</div>

<div class="box">
<h3>Előzmények (utolsó 10)</h3>
<div id="history"></div>
</div>

<div class="box small">
Ez az alkalmazás nem minősül orvosi eszköznek.<br>
A számítások tájékoztató jellegűek.
</div>
</section>

<section id="log">
<div class="box">
<h3>Előzmények (1 hónap)</h3>
<div id="fullHistory"></div>
</div>
</section>

<section id="settings">
<div class="box">
<h3>Beállítások</h3>
<label>Szénhidrát–inzulin arány</label>
<input id="cr" type="number" step="0.1">
<label>Cél vércukor</label>
<input id="target" type="number" step="0.1" value="5.5">
<label>Inzulinérzékenység</label>
<input id="isf" type="number" step="0.1">
<label>Hatásidő (perc)</label>
<input id="duration" type="number" value="180">
<button onclick="saveSettings()">Mentés</button>
<button class="danger" onclick="resetAll()">MINDEN TÖRLÉSE</button>
</div>
</section>

</main>

<div id="tabBar" style="display:none">

<div class="tab active" data-tab="home">
<svg viewBox="0 0 24 24">
<path d="M4 12L12 4L20 12"/>
<path d="M9 21V12H15V21"/>
</svg>
Kezdőoldal
</div>

<div class="tab" data-tab="log">
<svg viewBox="0 0 24 24">
<path d="M5 6H19"/>
<path d="M5 12H19"/>
<path d="M5 18H19"/>
</svg>
Napló
</div>

<div class="tab" data-tab="settings">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.6 1.6 0 0 0 .33 1.82"/>
<path d="M4.3 9a1.6 1.6 0 0 0-.33-1.82"/>
</svg>
Beállítások
</div>

</div>

<script>
const $=id=>document.getElementById(id);
let lastBolus=null;
let lastBgForPrediction=null;
let INSULIN_DURATION=180*60*1000;
const HYPO_LIMIT=4;

/* SETTINGS */
function saveSettings(){
const s={cr:+cr.value,target:+target.value,isf:+isf.value,duration:+duration.value};
localStorage.setItem("settings",JSON.stringify(s));
INSULIN_DURATION=s.duration*60000;
alert("Beállítások mentve");
updateIOB();
}
function loadSettings(){
const s=JSON.parse(localStorage.getItem("settings")||"{}");
if(s.cr)cr.value=s.cr;
if(s.target)target.value=s.target;
if(s.isf)isf.value=s.isf;
if(s.duration){duration.value=s.duration;INSULIN_DURATION=s.duration*60000;}
}

/* STORAGE */
function getBolusHistory(){return JSON.parse(localStorage.getItem("boluses")||"[]");}
function saveBolus(units,carbs,bg){
const h=getBolusHistory();
h.push({units,carbs,bg,time:Date.now()});
localStorage.setItem("boluses",JSON.stringify(h));
}

function resetAll(){
if(!confirm("Biztosan törölsz minden adatot?")) return;
localStorage.removeItem("boluses");
localStorage.removeItem("settings");
location.reload();
}

/* IOB – lineáris csökkenő */
function iobLinear(units, startTime, durationMin){
    const now = Date.now();
    const elapsed = (now - startTime)/60000;
    if(elapsed < 0 || elapsed >= durationMin) return 0;
    return units * (1 - elapsed/durationMin);
}

// IOB tetszőleges t időpontban (grafikonhoz)
function iobAtTime(t, boluses, durationMin){
    let total = 0;
    boluses.forEach(b=>{
        const elapsed = (t - b.time)/60000;
        if(elapsed >= 0 && elapsed < durationMin){
            total += b.units * (1 - elapsed/durationMin);
        }
    });
    return total;
}

function calcIOB(){
    const now = Date.now();
    let total = 0;
    let remaining = 0;
    getBolusHistory().forEach(b=>{
        total += iobLinear(b.units, b.time, INSULIN_DURATION/60000);
        const rem = b.time + INSULIN_DURATION - now;
        if(rem > remaining) remaining = rem;
    });
    return { total, remaining };
}

function updateIOB(){
    const { total, remaining } = calcIOB();
    iob.innerHTML=`<strong>${total.toFixed(2)} E</strong><br>
    <span class="small">Hátralévő idő: ${Math.ceil(remaining/60000)} perc</span>`;
    drawIOBChart();
    if(lastBgForPrediction!=null) renderBGPrediction(lastBgForPrediction);
}
setInterval(updateIOB,5000);

/* CALCULATION */
function calculate(){
    const carbsVal = parseFloat(carbs.value);
    const bgVal = parseFloat(bg.value);
    const s = JSON.parse(localStorage.getItem("settings") || "{}");
    if([carbsVal,bgVal,s.cr,s.target,s.isf].some(v=>isNaN(v))){
        alert("Hiányzó adat!");
        return;
    }

    const mealBolus = carbsVal / s.cr;
    const rawCorrBolus = bgVal >= s.target ? (bgVal - s.target)/s.isf : 0;
    const iobVal = calcIOB().total;
    const corrBolus = Math.max(0, rawCorrBolus - iobVal);
    lastBolus = mealBolus + corrBolus;

    result.innerHTML = `<strong>Javasolt: ${lastBolus.toFixed(2)} E</strong>`;
    injectBtn.style.display = cancelBtn.style.display = "block";

    lastBgForPrediction = bgVal;
    renderBGPrediction(bgVal);
}

function inject(){
    saveBolus(lastBolus, parseFloat(carbs.value), parseFloat(bg.value));
    cancel();
    updateIOB();
    renderHistory();
    renderFullHistory();
}

function cancel(){
result.innerHTML="";
injectBtn.style.display=cancelBtn.style.display="none";
}

/* UI */
function historyRow(b){
return `
<div class="history-item">
<span class="pill insulin">${b.units.toFixed(2)} E</span>
<span class="pill carb">${b.carbs} g CH</span>
<span class="pill bg">${b.bg} mmol/L</span><br>
<span class="small">${new Date(b.time).toLocaleString()}</span>
</div>`;
}

function renderHistory(){
    const h = getBolusHistory().slice(-10).reverse();
    const historyDiv = document.getElementById("history");
    historyDiv.innerHTML = h.length
        ? h.map(historyRow).join("")
        : "<span class='small'>Nincs adat</span>";
}

function renderFullHistory(){
    const monthAgo = Date.now() - 30*24*60*60*1000;
    const h = getBolusHistory().filter(b=>b.time >= monthAgo).reverse();
    fullHistory.innerHTML = h.length
        ? h.map(historyRow).join("")
        : "<span class='small'>Nincs adat</span>";
}

/* TABS */
document.querySelectorAll(".tab").forEach(t=>{
t.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
t.classList.add("active");
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
$(t.dataset.tab).classList.add("active");
if(t.dataset.tab==="home"){
    renderHistory();
    drawIOBChart();
    if(lastBgForPrediction!=null) renderBGPrediction(lastBgForPrediction);
}
if(t.dataset.tab==="log")renderFullHistory();
};
});

/* INIT */
window.onload = () => {
    loadSettings();
    updateIOB();
    renderHistory();
    renderFullHistory();
    splash.addEventListener("animationend", () => {
        splash.style.display = "none";
        document.querySelector("main").style.display = "block";
        tabBar.style.display = "flex";
        drawIOBChart();
    });
};
document.addEventListener("DOMContentLoaded", () => {
    renderHistory();
    renderFullHistory();
});

window.addEventListener("resize", () => {
    drawIOBChart();
    if(lastBgForPrediction!=null) renderBGPrediction(lastBgForPrediction);
});

/* ===== ÁLTALÁNOS VONALDIAGRAM (canvas) ===== */
function niceCeil(x){
    if(x<=0) return 1;
    const pow=Math.pow(10,Math.floor(Math.log10(x)));
    const norm=x/pow;
    let n; if(norm<=1)n=1; else if(norm<=2)n=2; else if(norm<=5)n=5; else n=10;
    return n*pow;
}

function drawLineChart(canvas, points, opts={}){
    if(!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth;
    const cssHeight = canvas.clientHeight;
    if(!cssWidth || !cssHeight) return;
    canvas.width = cssWidth*dpr;
    canvas.height = cssHeight*dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssWidth,cssHeight);
    if(points.length===0) return;

    const values = points.map(p=>p.v);
    let yMin = opts.yMin ?? Math.min(0, ...values);
    let yMax = opts.yMax ?? Math.max(...values);
    if(opts.threshold!=null){
        yMin = Math.min(yMin, opts.threshold);
        yMax = Math.max(yMax, opts.threshold);
    }
    if(yMax - yMin < 0.5) yMax = yMin + 0.5;
    const pad = (yMax-yMin)*0.15;
    yMax += pad;
    if(opts.yMin==null) yMin -= pad*0.4;

    const start = points[0].t, end = points[points.length-1].t;
    const totalRange = (end-start) || 1;
    const padL=32, padR=6, padT=8, padB=18;
    const w=cssWidth-padL-padR, h=cssHeight-padT-padB;
    const xPos=t=>padL+((t-start)/totalRange)*w;
    const yPos=v=>padT+h-((v-yMin)/(yMax-yMin))*h;

    const border="#E7E7E5", sub="#9A9A9A";
    ctx.font="10px -apple-system, sans-serif";

    ctx.strokeStyle=border; ctx.fillStyle=sub; ctx.lineWidth=1;
    [yMin+pad*0.4, (yMin+yMax)/2, yMax-pad].forEach(v=>{
        const y=yPos(v);
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+w,y); ctx.stroke();
        ctx.fillText(v.toFixed(opts.decimals ?? 2), 2, y+3);
    });

    ctx.textAlign="center";
    const fmt=t=>new Date(t).toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"});
    ctx.fillText(fmt(start), xPos(start), cssHeight-4);
    if(opts.now!=null && opts.now>=start && opts.now<=end) ctx.fillText("most", xPos(opts.now), cssHeight-4);
    ctx.fillText(fmt(end), xPos(end), cssHeight-4);
    ctx.textAlign="left";

    if(opts.threshold!=null){
        ctx.save();
        ctx.setLineDash([3,3]);
        ctx.strokeStyle = opts.thresholdColor || "#B45050";
        ctx.beginPath();
        ctx.moveTo(padL, yPos(opts.threshold));
        ctx.lineTo(padL+w, yPos(opts.threshold));
        ctx.stroke();
        ctx.restore();
    }

    ctx.beginPath();
    ctx.moveTo(xPos(points[0].t), yPos(Math.max(yMin,0)));
    points.forEach(p=>ctx.lineTo(xPos(p.t), yPos(p.v)));
    ctx.lineTo(xPos(points[points.length-1].t), yPos(Math.max(yMin,0)));
    ctx.closePath();
    ctx.fillStyle=(opts.color||"#3B4A5A")+"22";
    ctx.fill();

    ctx.beginPath();
    points.forEach((p,i)=>{
        const x=xPos(p.t), y=yPos(p.v);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=opts.color||"#3B4A5A";
    ctx.lineWidth=2;
    ctx.stroke();

    if(opts.now!=null){
        const nowClamped = Math.min(Math.max(opts.now, start), end);
        const nowX = xPos(nowClamped);
        ctx.save();
        ctx.setLineDash([3,3]);
        ctx.strokeStyle=sub;
        ctx.beginPath();
        ctx.moveTo(nowX, padT);
        ctx.lineTo(nowX, padT+h);
        ctx.stroke();
        ctx.restore();

        let nowVal = points[0].v;
        for(const p of points){ if(p.t<=opts.now) nowVal=p.v; }
        ctx.beginPath();
        ctx.arc(nowX, yPos(nowVal), 3.5, 0, Math.PI*2);
        ctx.fillStyle=opts.color||"#3B4A5A";
        ctx.fill();
    }
}

/* -------- Aktív inzulin grafikon -------- */
function drawIOBChart(){
    const canvas = $("iobChart");
    if(!canvas) return;
    const boluses = getBolusHistory();
    const durationMin = INSULIN_DURATION/60000;
    const now = Date.now();

    let maxRemaining = 0;
    boluses.forEach(b=>{
        const expiry = b.time + INSULIN_DURATION;
        if(expiry>now) maxRemaining = Math.max(maxRemaining, expiry-now);
    });

    const start = now - INSULIN_DURATION;
    const end = now + maxRemaining;
    const steps = 60;
    const points = [];
    for(let i=0;i<=steps;i++){
        const t = start + (end-start)*i/steps;
        points.push({ t, v: iobAtTime(t, boluses, durationMin) });
    }
    drawLineChart(canvas, points, { color:"#3B4A5A", now, decimals:2, yMin:0 });
}

/* -------- Várható vércukor grafikon -------- */
function renderBGPrediction(bgNow){
    const canvas = $("bgPredictionChart");
    if(!canvas) return;
    const s = JSON.parse(localStorage.getItem("settings") || "{}");
    if(!s.isf){ $("bgPredictionHint").textContent=""; return; }

    const boluses = getBolusHistory();
    const durationMin = INSULIN_DURATION/60000;
    const now = Date.now();
    const iobNow = iobAtTime(now, boluses, durationMin);

    const steps = 60;
    const points = [];
    for(let i=0;i<=steps;i++){
        const dtMin = durationMin*i/steps;
        const t = now + dtMin*60000;
        const iobFuture = iobAtTime(t, boluses, durationMin);
        // a mostanáig felhasznált (elhasznált) inzulin okozza a vércukor-csökkenést
        const bg = bgNow - s.isf*(iobNow - iobFuture);
        points.push({ t, v: bg });
    }

    drawLineChart(canvas, points, {
        color:"#5A4635",
        now,
        decimals:1,
        threshold: HYPO_LIMIT,
        thresholdColor: "#B45050"
    });

    const minBg = Math.min(...points.map(p=>p.v));
    const hint = $("bgPredictionHint");
    hint.textContent = minBg < HYPO_LIMIT
        ? `Figyelem: a becslés szerint a vércukor ${minBg.toFixed(1)} mmol/L-re eshet.`
        : `Várható legalacsonyabb érték: ${minBg.toFixed(1)} mmol/L.`;
    hint.style.color = minBg < HYPO_LIMIT ? "var(--hypo)" : "var(--muted)";
}
</script>

</body>
</html>
