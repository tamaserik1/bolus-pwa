<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bolus">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;width:100%;
  font-family:-apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background:#f2f2f7;color:#111;
}
body{display:flex;flex-direction:column}

/* DARK MODE */
body.dark{
  background:#000;color:#fff;
}
body.dark .card{background:#1c1c1e}
body.dark input{background:#2c2c2e;color:white;border:none}
body.dark .tabBar{background:#1c1c1e;border-color:#333}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:#1976d2;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:22px;font-weight:600;z-index:10;
  animation:fadeOut 1.5s ease forwards;animation-delay:1.2s;
}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* LAYOUT */
main{
  flex:1;overflow-y:auto;
  padding:16px;
  padding-bottom:90px;
}
h3{
  font-size:13px;
  letter-spacing:.04em;
  color:#8e8e93;
  margin-bottom:8px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

/* INPUT */
label{
  font-size:14px;
  color:#8e8e93;
  margin-top:12px;
  display:block;
}
input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#eef0f6;
  font-size:18px;
  margin-top:6px;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border-radius:14px;
  border:none;
  font-size:18px;
  background:#0a84ff;
  color:white;
}
.secondary{background:#d1d1d6;color:black}
.danger{background:#ff453a}

/* HISTORY */
.history-item{
  padding:10px 0;
  border-bottom:1px solid #e5e5ea;
  font-size:15px;
}
.small{font-size:13px;color:#8e8e93}

/* TAB BAR */
.tabBar{
  height:70px;
  display:flex;
  border-top:1px solid #ccc;
  background:white;
}
.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#8e8e93;
}
.tab.active{color:#0a84ff}
.tab svg{width:22px;height:22px;margin-bottom:4px}

/* SETTINGS LIST */
.settings-row{
  display:flex;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e5ea;
}
.settings-row:last-child{border:none}
.settings-label{flex:1}
.settings-value{color:#0a84ff;font-weight:500}

/* SWITCH */
.switch{position:relative;width:46px;height:28px}
.switch input{display:none}
.slider{
  position:absolute;inset:0;
  background:#ccc;border-radius:999px;
}
.slider:before{
  content:"";position:absolute;
  width:22px;height:22px;
  background:white;border-radius:50%;
  top:3px;left:3px;
  transition:.2s;
}
.switch input:checked + .slider{
  background:#34c759;
}
.switch input:checked + .slider:before{
  transform:translateX(18px);
}
</style>
</head>

<body>

<div id="splash">Bolus varázsló</div>

<main style="display:none">

<section id="home" class="active">

  <div class="card">
    <h3>SZÁMÍTÁS</h3>
    <label>Szénhidrát (g)</label>
    <input id="carbs" type="number">
    <label>Vércukor (mmol/L)</label>
    <input id="bg" type="number" step="0.1">
    <button onclick="calculate()">Számolás</button>
    <div id="result"></div>
    <button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
    <button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
  </div>

  <div class="card">
    <h3>AKTÍV INZULIN</h3>
    <div id="iob"></div>
  </div>

  <div class="card">
    <h3>ELŐZMÉNYEK</h3>
    <div id="history"></div>
  </div>

</section>

<section id="log">
  <div class="card">
    <h3>NAPLÓ (30 nap)</h3>
    <div id="fullHistory"></div>
  </div>
</section>

<section id="settings">
  <div class="card">
    <h3>BEÁLLÍTÁSOK</h3>

    <div class="settings-row">
      <div class="settings-label">Cél vércukor</div>
      <input id="target" type="number" step="0.1">
      <div class="settings-value">mmol/L</div>
    </div>

    <div class="settings-row">
      <div class="settings-label">Inzulinérzékenység</div>
      <input id="isf" type="number" step="0.1">
      <div class="settings-value">mmol/E</div>
    </div>

    <div class="settings-row">
      <div class="settings-label">CH arány</div>
      <input id="cr" type="number" step="0.1">
      <div class="settings-value">g/E</div>
    </div>

    <div class="settings-row">
      <div class="settings-label">Dark mode</div>
      <label class="switch">
        <input type="checkbox" onchange="document.body.classList.toggle('dark',this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <button onclick="saveSettings()">Mentés</button>
    <button class="danger" onclick="resetAll()">MINDEN TÖRLÉSE</button>
  </div>
</section>

</main>

<div class="tabBar" style="display:none">
  <div class="tab active" data-tab="home">🏠<div>Kezdőlap</div></div>
  <div class="tab" data-tab="log">📖<div>Napló</div></div>
  <div class="tab" data-tab="settings">⚙️<div>Beállítások</div></div>
</div>

<script>
/* A TELJES JS LOGIKA VÁLTOZATLAN – ugyanaz, amit küldtél */
</script>

</body>
</html>
