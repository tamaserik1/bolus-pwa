<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5F5F4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
--bg:#F5F5F4;
--card:#FFFFFF;
--text:#2A2A2A;
--muted:#8A8A8A;
--soft:#EFEFEF;
--accent:#DADADA;

--pill-ins-bg:rgba(120,140,160,.18);
--pill-ins-tx:#3B4A5A;
--pill-carb-bg:rgba(120,160,140,.20);
--pill-carb-tx:#355B48;
--pill-bg-bg:rgba(160,160,160,.22);
--pill-bg-tx:#444;
}

@media (prefers-color-scheme: dark){
:root{
--bg:#1F2123;
--card:#2A2C2F;
--text:#E6E6E6;
--muted:#A0A0A0;
--soft:#3A3C40;
--accent:#3A3C40;

--pill-ins-bg:rgba(120,140,160,.35);
--pill-ins-tx:#DCE6F0;
--pill-carb-bg:rgba(120,160,140,.35);
--pill-carb-tx:#DDEFE5;
--pill-bg-bg:rgba(180,180,180,.30);
--pill-bg-tx:#EEE;
}
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
flex-direction:column;
}

#splash{
position:fixed;inset:0;
background:var(--bg);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:600;
z-index:9999;
}

#splash img{width:110px;margin-bottom:16px}

main{display:none;flex:1;padding:18px;padding-bottom:92px}
section{display:none}
section.active{display:block}

.box{
background:var(--card);
padding:20px;
margin-bottom:20px;
border-radius:22px;
box-shadow:0 10px 25px rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.04);
}

h3{font-size:17px;margin-bottom:10px}
label{display:block;margin-top:16px;font-size:14px;color:var(--muted)}

input{
width:100%;
margin-top:8px;
padding:15px 16px;
font-size:17px;
border:none;
border-radius:15px;
background:var(--soft);
color:var(--text);
}

button{
margin-top:18px;
width:100%;
padding:15px;
font-size:17px;
border:none;
border-radius:15px;
background:var(--accent);
color:var(--text);
}
.secondary{background:var(--soft)}
.danger{background:#E0B4B4}

.history-item{padding:12px 0}

.pill{
display:inline-block;
padding:4px 12px;
border-radius:999px;
font-weight:600;
font-size:13px;
margin-right:6px;
}
.insulin{background:var(--pill-ins-bg);color:var(--pill-ins-tx)}
.carb{background:var(--pill-carb-bg);color:var(--pill-carb-tx)}
.bg{background:var(--pill-bg-bg);color:var(--pill-bg-tx)}

.small{font-size:13px;color:var(--muted)}

#tabBar{
position:fixed;bottom:0;left:0;right:0;
height:72px;
background:var(--card);
display:none;
border-top:1px solid var(--accent);
}

.tab{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:13px;
color:var(--muted);
}
.tab.active{color:var(--text)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;margin-bottom:4px}
</style>
</head>

<body>

<div id="splash">
<img src="icon-512.png">
Betöltés…
</div>

<main>

<section id="home" class="active">
<div class="box">
<h3>Számítás</h3>
<label>Szénhidrát (g)</label>
<input id="carbs" type="number">
<label>Aktuális vércukor (mmol/L)</label>
<input id="bg" type="number" step="0.1">
<button onclick="calculate()">Számolás</button>
<div id="result" style="margin-top:14px"></div>
<button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
<button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
</div>

<div class="box">
<h3>Aktív inzulin</h3>
<div id="iob"></div>
</div>

<div class="box">
<h3>Előzmények (utolsó 10)</h3>
<div id="history"></div>
</div>

<div class="box small">
Ez az alkalmazás nem minősül orvosi eszköznek.<br>
A számítások tájékoztató jellegűek, nem helyettesítik az orvosi döntést.
</div>
</section>

<section id="log">
<div class="box">
<h3>Előzmények (1 hónap)</h3>
<div id="fullHistory"></div>
</div>
</section>

<section id="settings">
<div class="box">
<h3>Beállítások</h3>
<label>Szénhidrát–inzulin arány</label>
<input id="cr" type="number">
<label>Cél vércukor</label>
<input id="target" type="number" value="5.5">
<label>Inzulinérzékenység</label>
<input id="isf" type="number">
<label>Hatásidő (perc)</label>
<input id="duration" type="number" value="180">
<button onclick="saveSettings()">Mentés</button>
<button class="danger" onclick="resetAll()">MINDEN TÖRLÉSE</button>
</div>
</section>

</main>

<div id="tabBar">
<div class="tab active" data-tab="home">🏠<div>Kezdő</div></div>
<div class="tab" data-tab="log">📖<div>Napló</div></div>
<div class="tab" data-tab="settings">⚙️<div>Beáll.</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let lastBolus=null;
let INSULIN_DURATION=180*60000;
const HYPO_LIMIT=4;

function saveSettings(){
const s={cr:+cr.value,target:+target.value,isf:+isf.value,duration:+duration.value};
localStorage.setItem("settings",JSON.stringify(s));
INSULIN_DURATION=s.duration*60000;
alert("Beállítások mentve");
}
function loadSettings(){
const s=JSON.parse(localStorage.getItem("settings")||"{}");
if(s.cr)cr.value=s.cr;
if(s.target)target.value=s.target;
if(s.isf)isf.value=s.isf;
if(s.duration){duration.value=s.duration;INSULIN_DURATION=s.duration*60000;}
}

function getBolusHistory(){return JSON.parse(localStorage.getItem("boluses")||"[]");}
function saveBolus(units,carbs,bg){
const h=getBolusHistory();
h.push({units,carbs,bg,time:Date.now()});
localStorage.setItem("boluses",JSON.stringify(h));
}

function calcIOB(){
const now=Date.now();let total=0,remaining=0,valid=[];
getBolusHistory().forEach(b=>{
const e=now-b.time;
if(e<INSULIN_DURATION){
const r=1-e/INSULIN_DURATION;
total+=b.units*r;
remaining=Math.max(remaining,INSULIN_DURATION-e);
valid.push(b);
}
});
localStorage.setItem("boluses",JSON.stringify(valid));
return {total,remaining};
}

function calculate(){
const carbsVal=+carbs.value,bgVal=+bg.value;
const s=JSON.parse(localStorage.getItem("settings")||"{}");
if([carbsVal,bgVal,s.cr,s.target,s.isf].some(v=>isNaN(v)))return alert("Hiányzó adat!");
const {total:iob}=calcIOB();
const meal=carbsVal/s.cr;
const corr=bgVal>=HYPO_LIMIT?Math.max(0,(bgVal-s.target)/s.isf-iob):0;
lastBolus=meal+corr;
result.innerHTML=`<strong>Javasolt: ${lastBolus.toFixed(2)} E</strong>`;
injectBtn.style.display=cancelBtn.style.display="block";
}

function inject(){
saveBolus(lastBolus,+carbs.value,+bg.value);
cancel();updateIOB();renderHistory();renderFullHistory();
}
function cancel(){
result.innerHTML="";
injectBtn.style.display=cancelBtn.style.display="none";
}

function updateIOB(){
const {total,remaining}=calcIOB();
iob.innerHTML=`<strong>${total.toFixed(2)} E</strong><br><span class="small">Hátralévő idő: ${Math.ceil(remaining/60000)} perc</span>`;
}

function historyRow(b){
return `
<div class="history-item">
<span class="pill insulin">${b.units.toFixed(2)} E</span>
<span class="pill carb">${b.carbs} g CH</span>
<span class="pill bg">${b.bg} mmol/L</span><br>
<span class="small">${new Date(b.time).toLocaleString()}</span>
</div>`;
}

function renderHistory(){
const h=getBolusHistory().slice(-10).reverse();
history.innerHTML=h.length?h.map(historyRow).join(""):"<span class='small'>Nincs adat</span>";
}
function renderFullHistory(){
const m=Date.now()-30*24*60*60*1000;
const h=getBolusHistory().filter(b=>b.time>=m).reverse();
fullHistory.innerHTML=h.length?h.map(historyRow).join(""):"<span class='small'>Nincs adat</span>";
}

document.querySelectorAll(".tab").forEach(t=>{
t.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
t.classList.add("active");
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
$(t.dataset.tab).classList.add("active");
};
});

window.onload=()=>{
loadSettings();
updateIOB();
renderHistory();
renderFullHistory();
setTimeout(()=>{
splash.style.display="none";
document.querySelector("main").style.display="block";
tabBar.style.display="flex";
},1500);
};

function resetAll(){
if(confirm("Biztos törlöd az összes adatot?")){
localStorage.clear();location.reload();
}
}

if("serviceWorker"in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
