<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e88e5">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1e88e5;
  --bg:#f2f4f8;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}
body.dark{
  --bg:#020617;
  --card:#0f172a;
  --text:#f8fafc;
  --muted:#94a3b8;
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
}

#splash{
  position:fixed;inset:0;
  background:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  font-weight:600;
  z-index:999;
}

main{
  display:none;
  padding:18px;
  padding-bottom:90px;
}

section{display:none}
section.active{display:block}

.card{
  background:var(--card);
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}

h2{
  font-size:15px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:12px;
}

label{
  font-size:14px;
  color:var(--muted);
  margin-top:14px;
  display:block;
}

input{
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:16px;
  border:none;
  background:#e8eef6;
  font-size:20px;
}
body.dark input{background:#020617;color:white}

button{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:18px;
  background:var(--primary);
  color:white;
  font-size:18px;
  font-weight:600;
}
.secondary{
  background:transparent;
  color:var(--text);
  border:1px solid #cbd5e1;
}

#result{
  margin-top:18px;
  padding:20px;
  border-radius:20px;
  background:linear-gradient(135deg,#1e88e5,#42a5f5);
  color:white;
  text-align:center;
}
#result .big{
  font-size:36px;
  font-weight:700;
}

.small{font-size:13px;color:var(--muted)}

#tabBar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:70px;
  display:flex;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  border-top:1px solid #e5e7eb;
}
body.dark #tabBar{background:rgba(15,23,42,.85)}

.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:var(--muted);
}
.tab.active{color:var(--primary)}
.tab span{font-size:22px}

.history{
  border-bottom:1px solid #e5e7eb;
  padding:10px 0;
}
</style>
</head>

<body>

<div id="splash">Bolus</div>

<main>

<section id="home" class="active">

<div class="card">
  <h2>Számítás</h2>

  <label>Szénhidrát (g)</label>
  <input id="carbs" type="number">

  <label>Vércukor (mmol/L)</label>
  <input id="bg" type="number" step="0.1">

  <button onclick="calculate()">Számolás</button>

  <div id="result" style="display:none">
    <div class="small">Javasolt inzulin</div>
    <div class="big" id="dose"></div>
    <button onclick="inject()">Beadás</button>
    <button class="secondary" onclick="clearCalc()">Mégse</button>
  </div>
</div>

<div class="card">
  <h2>Aktív inzulin</h2>
  <div id="iob" class="big">0.00 E</div>
</div>

<div class="card">
  <h2>Előzmények</h2>
  <div id="history"></div>
</div>

</section>

<section id="settings">
<div class="card">
  <h2>Beállítások</h2>

  <label>CH / 1E</label>
  <input id="cr" type="number">

  <label>Cél vércukor</label>
  <input id="target" type="number" step="0.1" value="5.5">

  <label>ISF</label>
  <input id="isf" type="number" step="0.1">

  <label>Inzulinhatás (perc)</label>
  <input id="duration" type="number" value="180">

  <button onclick="saveSettings()">Mentés</button>
  <button class="secondary" onclick="toggleTheme()">Dark mód</button>
</div>
</section>

</main>

<div id="tabBar">
  <div class="tab active" data-tab="home"><span>🏠</span>Kezdőlap</div>
  <div class="tab" data-tab="settings"><span>⚙️</span>Beállítások</div>
</div>

<script>
const $=id=>document.getElementById(id);
let INSULIN_DURATION=180*60000;

function getBoluses(){return JSON.parse(localStorage.boluses||"[]")}
function saveBolus(b){const h=getBoluses();h.push(b);localStorage.boluses=JSON.stringify(h)}

function calcIOB(){
  const now=Date.now();let total=0;
  const valid=[];
  getBoluses().forEach(b=>{
    const e=now-b.time;
    if(e<INSULIN_DURATION){
      total+=b.units*(1-e/INSULIN_DURATION);
      valid.push(b);
    }
  });
  localStorage.boluses=JSON.stringify(valid);
  return total;
}

function calculate(){
  const s=JSON.parse(localStorage.settings||"{}");
  const carbs=+carbs.value,bg=+bg.value;
  if(!carbs||!bg||!s.cr||!s.target||!s.isf)return alert("Hiányzó adat");
  const iob=calcIOB();
  const meal=carbs/s.cr;
  const corr=Math.max(0,(bg-s.target)/s.isf-iob);
  window.lastDose=meal+corr;
  result.style.display="block";
  dose.innerText=window.lastDose.toFixed(2)+" E";
}

function inject(){
  saveBolus({units:window.lastDose,time:Date.now()});
  clearCalc();render();
}

function clearCalc(){result.style.display="none"}

function render(){
  iob.innerText=calcIOB().toFixed(2)+" E";
  history.innerHTML=getBoluses().slice(-5).reverse()
    .map(b=>`<div class="history">${b.units.toFixed(2)} E<br><span class="small">${new Date(b.time).toLocaleString()}</span></div>`).join("")||"<span class='small'>Nincs adat</span>";
}

function saveSettings(){
  localStorage.settings=JSON.stringify({
    cr:+cr.value,
    target:+target.value,
    isf:+isf.value,
    duration:+duration.value
  });
  INSULIN_DURATION=+duration.value*60000;
  alert("Mentve");
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.theme=document.body.classList.contains("dark")?"dark":"light";
}

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
    t.classList.add("active");
    $(t.dataset.tab).classList.add("active");
  }
});

window.onload=()=>{
  if(localStorage.theme==="dark")document.body.classList.add("dark");
  const s=JSON.parse(localStorage.settings||"{}");
  if(s.cr)cr.value=s.cr;if(s.target)target.value=s.target;
  if(s.isf)isf.value=s.isf;if(s.duration)duration.value=s.duration;
  setTimeout(()=>{
    splash.style.display="none";
    document.querySelector("main").style.display="block";
  },600);
  render();
};
</script>

</body>
</html>
