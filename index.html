<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EDEDED">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ===== SZÍNPALETTA – REFERENCIAHŰ ===== */
:root{
  --bg:#F5F5F4;
  --card:#FFFFFF;
  --text:#2A2A2A;
  --muted:#8A8A8A;
  --soft:#EFEFEF;
  --accent:#DADADA;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{display:flex;flex-direction:column}

/* ===== SPLASH ===== */
#splash{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:600;
  z-index:9999;
  animation:fadeOut 1.2s ease forwards;
  animation-delay:1.2s;
}
#splash img{width:110px;margin-bottom:16px}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}

/* ===== LAYOUT ===== */
main{
  flex:1;
  padding:16px;
  padding-bottom:90px;
}
section{display:none}
section.active{display:block}

/* ===== KÁRTYÁK ===== */
.box{
  background:var(--card);
  padding:18px;
  margin-bottom:18px;
  border-radius:20px;
  box-shadow:
    0 10px 25px rgba(0,0,0,.06),
    0 4px 10px rgba(0,0,0,.04);
}

/* ===== FORM ===== */
h3{font-size:17px;margin-bottom:8px}

label{
  display:block;
  margin-top:14px;
  font-size:14px;
  color:var(--muted);
}

input{
  width:100%;
  margin-top:6px;
  padding:14px;
  font-size:17px;
  border:none;
  border-radius:14px;
  background:var(--soft);
}

/* ===== GOMBOK ===== */
button{
  margin-top:14px;
  width:100%;
  padding:15px;
  font-size:17px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:var(--text);
}
button:active{transform:scale(.97)}
.secondary{background:var(--soft)}
.danger{background:#E0B4B4}

/* ===== HISTORY ===== */
.history-item{
  padding:10px 0;
  font-size:15px;
  line-height:1.4;
}
.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  background:var(--soft);
  font-weight:600;
  font-size:13px;
}

/* ===== TAB BAR ===== */
#tabBar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:70px;
  background:var(--card);
  display:flex;
  border-top:1px solid var(--accent);
}
.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:13px;
  color:var(--muted);
}
.tab.active{color:var(--text)}
.tab span{font-size:22px;margin-bottom:2px}

.small{font-size:13px;color:var(--muted)}
</style>
</head>

<body>

<div id="splash">
  <img src="icon-512.png">
  Betöltés…
</div>

<main style="display:none">

<section id="home" class="active">
  <div class="box">
    <h3>Számítás</h3>
    <label>Szénhidrát (g)</label>
    <input id="carbs" type="number">
    <label>Aktuális vércukor (mmol/L)</label>
    <input id="bg" type="number" step="0.1">
    <button onclick="calculate()">Számolás</button>
    <div id="result" style="margin-top:12px"></div>
    <button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
    <button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
  </div>

  <div class="box">
    <h3>Aktív inzulin</h3>
    <div id="iob"></div>
  </div>

  <div class="box">
    <h3>Előzmények (utolsó 10)</h3>
    <div id="history"></div>
  </div>

  <div class="box small">
    Ez az alkalmazás nem minősül orvosi eszköznek.<br>
    A számítások tájékoztató jellegűek, nem helyettesítik az orvosi döntést.
  </div>
</section>

<section id="log">
  <div class="box">
    <h3>Előzmények (1 hónap)</h3>
    <div id="fullHistory"></div>
  </div>
</section>

<section id="settings">
  <div class="box">
    <h3>Beállítások</h3>
    <label>Szénhidrát–inzulin arány</label>
    <input id="cr" type="number" step="0.1">
    <label>Cél vércukor</label>
    <input id="target" type="number" step="0.1" value="5.5">
    <label>Inzulinérzékenység</label>
    <input id="isf" type="number" step="0.1">
    <label>Hatásidő (perc)</label>
    <input id="duration" type="number" value="180">
    <button onclick="saveSettings()">Mentés</button>
    <button class="danger" onclick="resetAll()">MINDEN TÖRLÉSE</button>
  </div>
</section>

</main>

<div id="tabBar" style="display:none">
  <div class="tab active" data-tab="home"><span>🏠</span>Kezdőoldal</div>
  <div class="tab" data-tab="log"><span>📖</span>Napló</div>
  <div class="tab" data-tab="settings"><span>⚙️</span>Beállítások</div>
</div>

<script>
/* ===== AZ EREDETI, MŰKÖDŐ JS-ED ===== */
const $=id=>document.getElementById(id);
let lastBolus=null;
let INSULIN_DURATION=180*60*1000;
const HYPO_LIMIT=4;

function saveSettings(){
 const s={cr:+cr.value,target:+target.value,isf:+isf.value,duration:+duration.value};
 localStorage.setItem("settings",JSON.stringify(s));
 INSULIN_DURATION=s.duration*60000;
 alert("Beállítások mentve");
}
function loadSettings(){
 const s=JSON.parse(localStorage.getItem("settings")||"{}");
 if(s.cr)cr.value=s.cr;
 if(s.target)target.value=s.target;
 if(s.isf)isf.value=s.isf;
 if(s.duration){duration.value=s.duration;INSULIN_DURATION=s.duration*60000;}
}

function getBolusHistory(){return JSON.parse(localStorage.getItem("boluses")||"[]");}
function saveBolus(units,carbs,bg){
 const h=getBolusHistory();
 h.push({units,carbs,bg,time:Date.now()});
 localStorage.setItem("boluses",JSON.stringify(h));
}

function calcIOB(){
 const now=Date.now();let total=0,remaining=0,valid=[];
 getBolusHistory().forEach(b=>{
  const e=now-b.time;
  if(e<INSULIN_DURATION){
   const r=1-e/INSULIN_DURATION;
   total+=b.units*r;
   remaining=Math.max(remaining,INSULIN_DURATION-e);
   valid.push(b);
  }
 });
 localStorage.setItem("boluses",JSON.stringify(valid));
 return {total,remaining};
}

function calculate(){
 const carbsVal=parseFloat(carbs.value);
 const bgVal=parseFloat(bg.value);
 const s=JSON.parse(localStorage.getItem("settings")||"{}");
 if([carbsVal,bgVal,s.cr,s.target,s.isf].some(v=>isNaN(v))){
   alert("Hiányzó adat!");
   return;
 }
 const {total:iob}=calcIOB();
 const meal=carbsVal/s.cr;
 const corr=bgVal>=HYPO_LIMIT?Math.max(0,(bgVal-s.target)/s.isf-iob):0;
 lastBolus=meal+corr;
 result.innerHTML=`<strong>Javasolt: ${lastBolus.toFixed(2)} E</strong>`;
 injectBtn.style.display=cancelBtn.style.display="block";
}

function inject(){
 saveBolus(lastBolus,parseFloat(carbs.value),parseFloat(bg.value));
 cancel();updateIOB();renderHistory();renderFullHistory();
}
function cancel(){
 result.innerHTML="";
 injectBtn.style.display=cancelBtn.style.display="none";
}

function updateIOB(){
 const {total,remaining}=calcIOB();
 iob.innerHTML=`<strong>${total.toFixed(2)} E</strong><br>
 <span class="small">Hátralévő idő: ${Math.ceil(remaining/60000)} perc</span>`;
}

function renderHistory(){
 history.innerHTML=getBolusHistory().slice(-10).reverse().map(b=>`
 <div class="history-item">
  <span class="badge">${b.units.toFixed(2)} E</span>
  <span class="badge">${b.carbs} g CH</span><br>
  <span class="small">${new Date(b.time).toLocaleString()}</span>
 </div>`).join("")||"<span class='small'>Nincs adat</span>";
}
function renderFullHistory(){renderHistory();}

document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  $(t.dataset.tab).classList.add("active");
 };
});

window.onload=()=>{
 loadSettings();updateIOB();renderHistory();
 splash.addEventListener("animationend",()=>{
  splash.style.display="none";
  document.querySelector("main").style.display="block";
  tabBar.style.display="flex";
 });
};

if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js");}
</script>

</body>
</html>
