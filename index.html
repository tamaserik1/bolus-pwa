<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F5F4">

<style>
/* ===== LIGHT MODE ===== */
:root{
  --bg:#F5F5F4;
  --card:#FFFFFF;
  --text:#2A2A2A;
  --muted:#8A8A8A;
  --soft:#EFEFEF;
  --accent:#DADADA;

  --pill-ins-bg:rgba(120,140,160,.18);
  --pill-ins-tx:#3B4A5A;
  --pill-carb-bg:rgba(120,160,140,.20);
  --pill-carb-tx:#355B48;
  --pill-bg-bg:rgba(150,150,150,.18);
  --pill-bg-tx:#444;
}

/* ===== DARK MODE ===== */
@media (prefers-color-scheme: dark){
:root{
  --bg:#1E1F21;
  --card:#2A2C2F;
  --text:#E6E6E6;
  --muted:#A0A0A0;
  --soft:#3A3C40;
  --accent:#444;

  --pill-ins-bg:rgba(120,140,160,.35);
  --pill-ins-tx:#DCE6F0;
  --pill-carb-bg:rgba(120,160,140,.35);
  --pill-carb-tx:#DDEFE5;
  --pill-bg-bg:rgba(180,180,180,.25);
  --pill-bg-tx:#EEE;
}
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}

main{padding:18px;padding-bottom:90px}
section{display:none}
section.active{display:block}

.box{
  background:var(--card);
  padding:20px;
  margin-bottom:20px;
  border-radius:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h3{font-size:17px;margin-bottom:10px}
label{margin-top:14px;display:block;color:var(--muted)}
input{
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:14px;
  border:none;
  background:var(--soft);
  color:var(--text);
}

button{
  margin-top:16px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:var(--text);
}

.history-item{padding:10px 0}

.pill{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  margin-right:6px;
}
.insulin{background:var(--pill-ins-bg);color:var(--pill-ins-tx)}
.carb{background:var(--pill-carb-bg);color:var(--pill-carb-tx)}
.bg{background:var(--pill-bg-bg);color:var(--pill-bg-tx)}

.small{font-size:13px;color:var(--muted)}

#tabBar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:72px;
  display:flex;
  background:var(--card);
  border-top:1px solid var(--accent);
}
.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:var(--muted);
}
.tab.active{color:var(--text)}
.tab svg{
  width:22px;height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.6;
  margin-bottom:4px;
}
</style>
</head>

<body>

<main>
<section id="home" class="active">
  <div class="box">
    <h3>Számítás</h3>
    <label>Szénhidrát (g)</label>
    <input id="carbs" type="number">
    <label>Vércukor (mmol/L)</label>
    <input id="bg" type="number" step="0.1">
    <button onclick="calculate()">Számolás</button>
    <div id="result"></div>
    <button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
  </div>

  <div class="box">
    <h3>Előzmények (utolsó 10)</h3>
    <div id="history"></div>
  </div>
</section>

<section id="log">
  <div class="box">
    <h3>Előzmények (1 hónap)</h3>
    <div id="fullHistory"></div>
  </div>
</section>

<section id="settings">
  <div class="box">
    <h3>Beállítások</h3>
    <label>CH arány</label><input id="cr">
    <label>Cél vércukor</label><input id="target">
    <label>Érzékenység</label><input id="isf">
    <button onclick="saveSettings()">Mentés</button>
  </div>
</section>
</main>

<div id="tabBar">
  <div class="tab active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M4 12L12 4L20 12"/><path d="M9 21V12H15V21"/></svg>
    Kezdőoldal
  </div>
  <div class="tab" data-tab="log">
    <svg viewBox="0 0 24 24"><path d="M5 6H19"/><path d="M5 12H19"/><path d="M5 18H19"/></svg>
    Napló
  </div>
  <div class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
    Beállítások
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

function getBolusHistory(){
 return JSON.parse(localStorage.getItem("boluses")||"[]");
}
function saveBolus(u,c,b){
 const h=getBolusHistory();
 h.push({units:u,carbs:c,bg:b,time:Date.now()});
 localStorage.setItem("boluses",JSON.stringify(h));
}

function historyRow(b){
 return `
 <div class="history-item">
   <span class="pill insulin">${b.units.toFixed(2)} E</span>
   <span class="pill carb">${b.carbs} g</span>
   <span class="pill bg">${b.bg} mmol/L</span><br>
   <span class="small">${new Date(b.time).toLocaleString()}</span>
 </div>`;
}

function renderHistory(){
 const h=getBolusHistory().slice(-10).reverse();
 history.innerHTML=h.map(historyRow).join("")||"<span class='small'>Nincs adat</span>";
}
function renderFullHistory(){
 fullHistory.innerHTML=getBolusHistory().reverse().map(historyRow).join("");
}

function calculate(){
 lastBolus=1.5;
 result.innerHTML=`<strong>Javasolt: ${lastBolus} E</strong>`;
 injectBtn.style.display="block";
}
function inject(){
 saveBolus(lastBolus,+carbs.value,+bg.value);
 renderHistory();renderFullHistory();
}

document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  $(t.dataset.tab).classList.add("active");
  renderHistory();renderFullHistory();
 };
});

renderHistory();renderFullHistory();
</script>
</body>
</html>
