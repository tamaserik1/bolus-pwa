<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}
body.dark{
  background:#020617;
  color:#f8fafc;
}

body{display:flex;flex-direction:column}

/* SPLASH */
#splash{
  position:fixed;inset:0;
  background:#1976d2;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:600;
  z-index:9999;
}

/* MAIN */
main{
  flex:1;
  display:none;
  padding:16px;
  padding-bottom:90px;
}

section{display:none}
section.active{display:flex;flex-direction:column}

/* CARD */
.box{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:
    0 1px 2px rgba(0,0,0,.04),
    0 12px 28px rgba(0,0,0,.08);
}
body.dark .box{background:#0f172a}

/* TYPO */
h3{
  font-size:15px;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:10px;
}
body.dark h3{color:#94a3b8}

label{margin-top:12px;display:block;font-size:15px}

/* INPUT */
input{
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#eef2f7;
  font-size:18px;
}
body.dark input{
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  margin-top:14px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  background:#1976d2;
  color:white;
  font-size:18px;
  font-weight:600;
}
.secondary{
  background:#e5e7eb;
  color:#111;
}
body.dark .secondary{
  background:#1f2937;
  color:#f8fafc;
}
.danger{background:#d32f2f}

/* RESULT */
#result{
  margin-top:14px;
  background:linear-gradient(135deg,#1976d2,#42a5f5);
  color:white;
  border-radius:18px;
  padding:16px;
}

/* HISTORY */
.history-item{
  padding:10px 0;
  border-bottom:1px solid #e5e7eb;
  font-size:15px;
}
body.dark .history-item{border-color:#1f2937}

.insulin-unit{
  background:#1976d2;
  color:white;
  padding:2px 8px;
  border-radius:6px;
  font-weight:600;
  margin-right:6px;
}
.carb-unit{
  background:#16a34a;
  color:white;
  padding:2px 8px;
  border-radius:6px;
  font-weight:600;
}

.small{font-size:13px;color:#64748b}
body.dark .small{color:#94a3b8}

/* TAB BAR */
#tabBar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:75px;
  display:none;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  border-top:1px solid #e5e7eb;
}
body.dark #tabBar{
  background:rgba(15,23,42,.85);
  border-color:#1f2937;
}

.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#64748b;
}
.tab.active{color:#1976d2;font-weight:600}
.tab .icon{font-size:22px}

/* SETTINGS LIST */
.settings-list{
  background:white;
  border-radius:16px;
  overflow:hidden;
}
body.dark .settings-list{background:#0f172a}

.settings-row{
  display:flex;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid #e5e7eb;
}
body.dark .settings-row{border-color:#1f2937}

.settings-row:last-child{border-bottom:none}
.settings-icon{
  width:26px;
  text-align:center;
  margin-right:12px;
}
.settings-label{flex:1}
.settings-value{color:#1976d2}

/* TOGGLE */
.switch{position:relative;width:46px;height:28px}
.switch input{display:none}
.slider{
  position:absolute;inset:0;
  background:#d1d5db;
  border-radius:999px;
}
.slider:before{
  content:"";
  position:absolute;
  width:22px;height:22px;
  left:3px;top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}
.switch input:checked + .slider{
  background:#34c759;
}
.switch input:checked + .slider:before{
  transform:translateX(18px);
}
</style>
</head>

<body>

<div id="splash">Bolus</div>

<main>

<!-- HOME -->
<section id="home" class="active">
  <div class="box">
    <h3>Számítás</h3>

    <label>Szénhidrát (g)</label>
    <input id="carbs" type="number">

    <label>Vércukor (mmol/L)</label>
    <input id="bg" type="number" step="0.1">

    <button onclick="calculate()">Számolás</button>

    <div id="result"></div>
    <button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
    <button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
  </div>

  <div class="box">
    <h3>Aktív inzulin</h3>
    <div id="iob"></div>
  </div>

  <div class="box">
    <h3>Előzmények</h3>
    <div id="history"></
