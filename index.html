<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5F5F4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
--bg:#F5F5F4;
--card:#FFFFFF;
--text:#2A2A2A;
--muted:#8A8A8A;
--soft:#EFEFEF;
--accent:#DADADA;

--pill-ins-bg:rgba(120,140,160,.18);
--pill-ins-tx:#3B4A5A;
--pill-carb-bg:rgba(120,160,140,.20);
--pill-carb-tx:#355B48;
--pill-bg-bg:rgba(160,140,120,.20);   /* FIX */
--pill-bg-tx:#5A4635;                 /* FIX */
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;
background:var(--bg);
color:var(--text);
}

body{display:flex;flex-direction:column}

/* ---- marad minden ---- */

.pill{
display:inline-block;
padding:4px 12px;
border-radius:999px;
font-weight:600;
font-size:13px;
margin-right:6px;
}

.pill.insulin{background:var(--pill-ins-bg);color:var(--pill-ins-tx);}
.pill.carb{background:var(--pill-carb-bg);color:var(--pill-carb-tx);}
.pill.bg{background:var(--pill-bg-bg);color:var(--pill-bg-tx);} /* FIX */

/* ---- TAB BAR ICONOK ---- */
#tabBar{
position:fixed;
bottom:0;left:0;right:0;
height:72px;
background:var(--card);
display:flex;
border-top:1px solid var(--accent);
}

.tab{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:12px;
color:var(--muted);
}

.tab.active{color:var(--text)}

.tab svg{
width:22px;
height:22px;
stroke:currentColor;
fill:none;
stroke-width:1.6;
margin-bottom:4px;
}
</style>
</head>

<body>

<!-- ---- marad minden ---- -->

<div id="tabBar" style="display:none">
<div class="tab active" data-tab="home">
<svg viewBox="0 0 24 24">
<path d="M4 12L12 4L20 12"/>
<path d="M9 21V12H15V21"/>
</svg>
Kezdőoldal
</div>

<div class="tab" data-tab="log">
<svg viewBox="0 0 24 24">
<path d="M5 6H19"/>
<path d="M5 12H19"/>
<path d="M5 18H19"/>
</svg>
Napló
</div>

<div class="tab" data-tab="settings">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.6 1.6 0 0 0 .33 1.82"/>
<path d="M4.3 9a1.6 1.6 0 0 0-.33-1.82"/>
</svg>
Beállítások
</div>
</div>

<script>
/* ---- csak a historyRow változik ---- */
function historyRow(b){
return `
<div class="history-item">
<span class="pill insulin">${b.units.toFixed(2)} E</span>
<span class="pill carb">${b.carbs} g CH</span>
<span class="pill bg">${b.bg} mmol/L</span><br>
<span class="small">${new Date(b.time).toLocaleString()}</span>
</div>`;
}

/* ---- FIX: biztos render home-on ---- */
window.onload=()=>{
loadSettings();
updateIOB();
renderHistory();          // FIX
renderFullHistory();
splash.addEventListener("animationend",()=>{
splash.style.display="none";
document.querySelector("main").style.display="block";
tabBar.style.display="flex";
renderHistory();          // FIX
});
};
</script>

</body>
</html>
