<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus Varázsló</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e88e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bolus">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* ===================== THEME ===================== */
:root {
  --primary:#1e88e5;
  --primary-soft:#e3f2fd;
  --danger:#e53935;

  --bg:#f7f9fb;
  --card:#ffffff;

  --text-main:#111;
  --text-secondary:#6b7280;

  --border:#e5e7eb;
}

body.dark {
  --bg:#0f172a;
  --card:#111827;

  --text-main:#f9fafb;
  --text-secondary:#9ca3af;

  --primary-soft:#1e293b;
  --border:#1f2937;
}

/* ===================== RESET ===================== */
* { box-sizing:border-box; margin:0; padding:0; }
html,body {
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text-main);
}
body { display:flex; flex-direction:column; }

/* ===================== SPLASH ===================== */
#splash {
  position:fixed; inset:0;
  background:var(--primary);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 1.4s ease forwards;
  animation-delay:1.2s;
}
#splash img {
  width:96px;
  height:96px;
  margin-bottom:20px;
  animation:scaleOut 1.4s ease forwards;
}
@keyframes fadeOut { to { opacity:0; visibility:hidden; } }
@keyframes scaleOut { to { transform:scale(1.15); opacity:0; } }

/* ===================== LAYOUT ===================== */
main {
  flex:1;
  padding:16px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  overflow-y:auto;
  display:none;
}

section { display:none; flex-direction:column; gap:16px; }
section.active { display:flex; }

/* ===================== CARDS ===================== */
.card {
  background:var(--card);
  border-radius:16px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.04);
}

h3 {
  font-size:17px;
  margin-bottom:10px;
}

/* ===================== FORMS ===================== */
label {
  font-size:14px;
  color:var(--text-secondary);
  margin-top:12px;
  display:block;
}
input {
  width:100%;
  padding:12px;
  margin-top:6px;
  font-size:17px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-main);
}

/* ===================== BUTTONS ===================== */
button {
  margin-top:14px;
  width:100%;
  padding:14px;
  font-size:17px;
  font-weight:600;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
}
button.secondary {
  background:transparent;
  border:1px solid var(--primary);
  color:var(--primary);
}
button.danger {
  background:var(--danger);
}

/* ===================== RESULT ===================== */
#result {
  background:var(--primary-soft);
  border-radius:14px;
  padding:14px;
  margin-top:14px;
}
#result strong {
  font-size:22px;
}

/* ===================== HISTORY ===================== */
.history-item {
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:15px;
}
.unit {
  display:inline-block;
  min-width:52px;
  padding:3px 8px;
  border-radius:8px;
  background:var(--primary);
  color:white;
  font-weight:600;
}

/* ===================== TAB BAR ===================== */
#tabBar {
  display:none;
  height:70px;
  background:var(--card);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab {
  flex:1;
  text-align:center;
  font-size:12px;
  color:var(--text-secondary);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.tab.active { color:var(--primary); }
.tab svg {
  width:22px;
  height:22px;
  fill:currentColor;
  margin-bottom:4px;
}

/* ===================== MISC ===================== */
.small { font-size:13px; color:var(--text-secondary); }
.toggle {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div id="splash">
  <img src="icon-512.png">
  Bolus Varázsló
</div>

<main>

<section id="home" class="active">
  <div class="card">
    <h3>Számítás</h3>
    <label>Szénhidrát (g)</label>
    <input id="carbs" type="number">
    <label>Aktuális vércukor (mmol/L)</label>
    <input id="bg" type="number" step="0.1">
    <button onclick="calculate()">Számolás</button>
    <div id="result"></div>
    <button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
    <button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
  </div>

  <div class="card">
    <h3>Aktív inzulin</h3>
    <div id="iob"></div>
  </div>

  <div class="card">
    <h3>Utolsó adagok</h3>
    <div id="history"></div>
  </div>

  <div class="small">
    Nem minősül orvosi eszköznek. Tájékoztató jellegű.
  </div>
</section>

<section id="settings">
  <div class="card">
    <h3>Beállítások</h3>

    <label>Szénhidrát–inzulin arány</label>
    <input id="cr" type="number" step="0.1">

    <label>Cél vércukor</label>
    <input id="target" type="number" step="0.1">

    <label>Inzulinérzékenység</label>
    <input id="isf" type="number" step="0.1">

    <label>Hatástartam (perc)</label>
    <input id="duration" type="number">

    <div class="toggle">
      <span>Dark mód</span>
      <input type="checkbox" id="darkToggle">
    </div>

    <button onclick="saveSettings()">Mentés</button>
    <button class="danger" onclick="resetAll()">MINDEN TÖRLÉSE</button>
  </div>
</section>

</main>

<div id="tabBar">
  <div class="tab active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
    Kezdő
  </div>
  <div class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/></svg>
    Beállítások
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let lastBolus=null;
let INSULIN_DURATION=180*60000;

/* THEME */
function applyTheme(){
  document.body.classList.toggle("dark",localStorage.theme==="dark");
  darkToggle.checked=localStorage.theme==="dark";
}
darkToggle.onchange=()=>{localStorage.theme=darkToggle.checked?"dark":"light";applyTheme();}

/* SETTINGS */
function saveSettings(){
  localStorage.settings=JSON.stringify({
    cr:+cr.value,target:+target.value,isf:+isf.value,duration:+duration.value
  });
  INSULIN_DURATION=duration.value*60000;
  alert("Mentve");
}
function loadSettings(){
  const s=JSON.parse(localStorage.settings||"{}");
  if(s.cr)cr.value=s.cr;
  if(s.target)target.value=s.target;
  if(s.isf)isf.value=s.isf;
  if(s.duration){duration.value=s.duration;INSULIN_DURATION=s.duration*60000;}
}

/* STORAGE */
function getHistory(){return JSON.parse(localStorage.bolus||"[]");}
function saveBolus(u,c,b){const h=getHistory();h.push({u,c,b,t:Date.now()});localStorage.bolus=JSON.stringify(h);}

/* IOB */
function calcIOB(){
  let t=0,r=0,now=Date.now();
  getHistory().forEach(b=>{
    const e=now-b.t;
    if(e<INSULIN_DURATION){
      const k=1-e/INSULIN_DURATION;
      t+=b.u*k;
      r=Math.max(r,INSULIN_DURATION-e);
    }
  });
  return{t,r};
}

/* CALC */
function calculate(){
  const c=+carbs.value,b=+bg.value,s=JSON.parse(localStorage.settings||"{}");
  if(!c||!b||!s.cr||!s.isf)return alert("Hiányzó adat");
  const i=calcIOB().t;
  const meal=c/s.cr;
  const corr=Math.max(0,(b-s.target)/s.isf-i);
  lastBolus=meal+corr;
  result.innerHTML=`<strong>${lastBolus.toFixed(2)} E</strong>`;
  injectBtn.style.display=cancelBtn.style.display="block";
}
function inject(){
  saveBolus(lastBolus,+carbs.value,+bg.value);
  result.innerHTML="";injectBtn.style.display=cancelBtn.style.display="none";
  render();
}
function cancel(){result.innerHTML="";injectBtn.style.display=cancelBtn.style.display="none";}

/* RENDER */
function render(){
  const h=getHistory().slice(-5).reverse();
  history.innerHTML=h.map(b=>`
    <div class="history-item">
      <span class="unit">${b.u.toFixed(2)}E</span>
      ${b.c}g – ${b.b} mmol/L
    </div>`).join("");
  const i=calcIOB();
  iob.innerHTML=`<strong>${i.t.toFixed(2)} E</strong><br><span class="small">${Math.ceil(i.r/60000)} perc</span>`;
}

/* NAV */
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
    $(t.dataset.tab).classList.add("active");
  };
});

function resetAll(){if(confirm("Biztos?")){localStorage.clear();location.reload();}}

window.onload=()=>{
  applyTheme();
  loadSettings();
  render();
  splash.onanimationend=()=>{
    splash.style.display="none";
    main.style.display="block";
    tabBar.style.display="flex";
  };
};
</script>
</body>
</html>
