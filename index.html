<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bolus varázsló</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5F5F4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
--bg:#F5F5F4;
--card:#FFFFFF;
--text:#2A2A2A;
--muted:#8A8A8A;
--soft:#EFEFEF;
--accent:#DADADA;

--pill-ins-bg:rgba(120,140,160,.18);
--pill-ins-tx:#3B4A5A;
--pill-carb-bg:rgba(120,160,140,.20);
--pill-carb-tx:#355B48;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;
background:var(--bg);
color:var(--text);
}

body{display:flex;flex-direction:column}

#splash{
position:fixed;inset:0;
background:var(--bg);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:600;
z-index:9999;
animation:fadeOut 1.2s ease forwards;
animation-delay:1.2s;
}
#splash img{width:110px;margin-bottom:16px}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}

main{
flex:1;
padding:18px;
padding-bottom:92px;
}
section{display:none}
section.active{display:block}

.box{
background:var(--card);
padding:20px;
margin-bottom:20px;
border-radius:22px;
box-shadow:
0 10px 25px rgba(0,0,0,.06),
0 4px 10px rgba(0,0,0,.04);
}

h3{
font-size:17px;
margin-bottom:10px;
font-weight:600;
}

label{
display:block;
margin-top:16px;
font-size:14px;
color:var(--muted);
}

input{
width:100%;
margin-top:8px;
padding:15px 16px;
font-size:17px;
border:none;
border-radius:15px;
background:var(--soft);
}

button{
margin-top:18px;
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:999px;
background:rgba(0,0,0,.04);
color:var(--text);
font-weight:600;
}
button:active{transform:scale(.97)}
.secondary{background:rgba(0,0,0,.03)}
.danger{background:rgba(180,80,80,.18)}

.history-item{
padding:12px 0;
font-size:15px;
line-height:1.45;
}

.pill{
display:inline-block;
padding:4px 12px;
border-radius:999px;
font-weight:600;
font-size:13px;
margin-right:6px;
}

.pill.insulin{
background:var(--pill-ins-bg);
color:var(--pill-ins-tx);
}
.pill.carb{
background:var(--pill-carb-bg);
color:var(--pill-carb-tx);
}

.small{font-size:13px;color:var(--muted)}

.pill.bg{
background:rgba(160,140,120,.20);
color:#5A4635;
}

#tabBar{
position:fixed;
bottom:0;left:0;right:0;
height:72px;
background:var(--card);
display:flex;
border-top:1px solid var(--accent);
}

.tab{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:13px;
color:var(--muted);
}

.tab.active{color:var(--text)}

.tab svg{
width:22px;
height:22px;
stroke:currentColor;
fill:none;
stroke-width:1.6;
margin-bottom:4px;
}
</style>
</head>

<body>

<div id="splash">
<img src="icon-512.png">
Betöltés…
</div>

<main style="display:none">

<section id="home" class="active">
<div class="box">
<h3>Számítás</h3>
<label>Szénhidrát (g)</label>
<input id="carbs" type="number">
<label>Aktuális vércukor (mmol/L)</label>
<input id="bg" type="number" step="0.1">
<button onclick="calculate()">Számolás</button>
<div id="result" style="margin-top:14px"></div>
<button id="injectBtn" style="display:none" onclick="inject()">Beadás</button>
<button id="cancelBtn" class="secondary" style="display:none" onclick="cancel()">Mégse</button>
</div>

<div class="box">
<h3>Aktív inzulin</h3>
<div id="iob"></div>
<div id="iobChart" style="margin-top:10px; height:60px;"></div>

<!-- ÚJ GRAFIKON – CSAK HOZZÁADVA -->
<div id="bgPredictionChart" style="margin-top:12px;height:80px;"></div>
</div>

<div class="box">
<h3>Előzmények (utolsó 10)</h3>
<div id="history"></div>
</div>

<div class="box small">
Ez az alkalmazás nem minősül orvosi eszköznek.<br>
A számítások tájékoztató jellegűek.
</div>
</section>

<section id="log">
<div class="box">
<h3>Előzmények (1 hónap)</h3>
<div id="fullHistory"></div>
</div>
</section>

<section id="settings">
<div class="box">
<h3>Beállítások</h3>
<label>Szénhidrát–inzulin arány</label>
<input id="cr" type="number" step="0.1">
<label>Cél vércukor</label>
<input id="target" type="number" step="0.1" value="5.5">
<label>Inzulinérzékenység</label>
<input id="isf" type="number" step="0.1">
<label>Hatásidő (perc)</label>
<input id="duration" type="number" value="180">
<button onclick="saveSettings()">Mentés</button>
<button class="danger" onclick="resetAll()">MINDEN TÖRLÉSE</button>
</div>
</section>

</main>

<div id="tabBar" style="display:none">
<div class="tab active" data-tab="home">Kezdőoldal</div>
<div class="tab" data-tab="log">Napló</div>
<div class="tab" data-tab="settings">Beállítások</div>
</div>

<script>
/* ===== BG PREDIKCIÓ – TELJESEN FÜGGETLEN ===== */

function insulinEffectLinear(t, d){
    if(t < 0 || t > d) return 0;
    return 1 - (t / d);
}

function renderBGPrediction(bgNow){
    const chart = document.getElementById("bgPredictionChart");
    if(!chart) return;

    const s = JSON.parse(localStorage.getItem("settings") || "{}");
    if(!s.isf) return;

    const durationMin = INSULIN_DURATION / 60000;
    const history = getBolusHistory();
    const points = [];

    for(let t=0; t<=durationMin; t+=5){
        let insulinEffect = 0;

        history.forEach(b=>{
            const elapsed = (Date.now() - b.time)/60000 + t;
            insulinEffect += b.units * insulinEffectLinear(elapsed, durationMin);
        });

        points.push(bgNow - insulinEffect * s.isf);
    }

    const min = Math.min(...points);
    const max = Math.max(...points);
    const range = Math.max(1, max - min);

    chart.innerHTML = points.map(v=>{
        const h = ((v - min) / range) * 70 + 5;
        return `<div style="display:inline-block;width:3px;height:${h}px;background:#355B48;margin-right:1px"></div>`;
    }).join("");
}
</script>

</body>
</html>
